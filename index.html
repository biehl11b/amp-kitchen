<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AMP Kitchen"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json">
<title>AMP Kitchen</title>
<style>
:root{--ink:#14181f;--ink2:#3b4250;--muted:#6b7280;--line:#e5e7eb;--soft:#f4f5f7;--accent:#d9481c;--accent-d:#b63a14;--ok:#1f7a4d;--warn:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--soft);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:var(--accent-d)}
h2{font-size:1.3rem;margin:0}h3{font-size:1.05rem;margin:22px 0 10px}
.muted{color:var(--muted)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 18px 40px}
.logo{font-weight:800;font-size:1.35rem;letter-spacing:.02em}.logo span{color:var(--accent);font-weight:700}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 20px;position:sticky;top:0;z-index:5}
.top-right{display:flex;gap:10px;align-items:center}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:.92rem;min-height:40px}
.btn.big{padding:16px 22px;font-size:1.05rem}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pill{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem}
.range-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:#fff;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;border-radius:999px;padding:10px 16px;font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;min-height:44px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.custom{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.custom input{font:inherit;font-size:.95rem;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;min-height:44px}
.alert{border-radius:12px;padding:14px 16px;margin-bottom:16px}
.alert.err{background:#fef3f2;border:1px solid #fecdca;color:var(--warn)}
.alert.warn{background:#fff7e6;border:1px solid #f5d79e;color:#7a4b00}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:2rem;line-height:1.1}.stat span{color:var(--muted);font-size:.9rem}
.print-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.print-btn{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink);display:block;min-height:76px;text-align:left;font:inherit;cursor:pointer;width:100%}
.print-btn b{display:block;font-size:1.05rem}.print-btn span{color:var(--muted);font-size:.88rem}
.print-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.print-btn.primary span{color:#ffe1d6}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:12px 14px;text-decoration:none;color:var(--muted);font-weight:600;border:0;border-bottom:3px solid transparent;white-space:nowrap;background:none;font:inherit;font-weight:600;cursor:pointer}
.tab.on{color:var(--ink);border-color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols .card{margin:0}
table.list{width:100%;border-collapse:collapse}
.list td,.list th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.list th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.list tr:last-child td{border-bottom:0}
.list td.n{width:56px;font-size:1.35rem;font-weight:800;text-align:right;padding-right:16px}
.special{background:#fff1ec;color:var(--accent-d);font-weight:700;border-radius:6px;padding:1px 6px}
.empty{text-align:center;color:var(--muted);padding:40px}
.label-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.lblp{border:1.5px dashed #c5c9d0;border-radius:8px;padding:12px;text-align:center}
.lbl-loc{font-weight:800;font-size:.85rem;letter-spacing:.06em;background:var(--ink);color:#fff;border-radius:4px;padding:3px 6px;display:inline-block}
.lbl-name{font-size:1.25rem;font-weight:700;margin-top:6px}
.send-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.steps li{margin-bottom:10px}
code{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:.88rem;word-break:break-all}
.foot{text-align:center;font-size:.85rem;padding:0 0 30px}.foot a{color:var(--muted)}
.login{display:grid;place-items:center;min-height:100vh}
.login-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;width:min(380px,90vw)}
.login-box label{display:block;font-weight:600;margin:18px 0 6px}
.login-box input{width:100%;font:inherit;padding:14px;border:1.5px solid var(--line);border-radius:10px}
.login-box .btn{width:100%;margin-top:14px}
.err{color:var(--warn)}
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.how-grid p{margin:8px 0 0;font-size:.92rem;color:var(--ink2)}
.how-grid>div{border:1px solid var(--line);border-radius:12px;padding:12px}
.src{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.src.s1{background:#eef2ff;color:#3730a3}.src.s2{background:#ecfdf3;color:#1f7a4d}.src.s3{background:#fff7e6;color:#8a5300}
.install-tip{background:#ecfdf3;border-bottom:1px solid #abefc6;color:#05603a;padding:10px 46px 10px 16px;position:relative;font-size:.95rem}
.install-tip .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:1.1rem;padding:6px 10px;cursor:pointer;color:inherit}
.role-tag{font-size:.75rem;background:var(--ink);color:#fff;border-radius:999px;padding:3px 9px;vertical-align:middle;letter-spacing:.02em}
.bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar.near i{background:#d97706}.bar.full i{background:var(--warn)}
.done-row td{color:#9aa1ad}.done-row td.n{color:var(--ok)}
.tag{font-size:.72rem;font-weight:800;border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.tag.red{background:#fef3f2;color:var(--warn);border:1px solid #fecdca}
.st-dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.st-dot.made{background:#2563eb}.st-dot.packed{background:var(--ok)}.st-dot.picked{background:#6b7280}
.order{display:flex;gap:14px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:14px 4px;flex-wrap:wrap}
.order:first-of-type{border-top:0}
.order-name{font-weight:700;font-size:1.05rem}
.order-items{font-size:.95rem;margin-top:4px;color:var(--ink2)}
.order-btns{display:flex;gap:8px}
.sbtn{font:inherit;font-weight:700;font-size:.95rem;min-height:52px;min-width:104px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink2)}
.sbtn.made.on{background:#2563eb;border-color:#2563eb;color:#fff}
.sbtn.packed.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sbtn.picked.on{background:#6b7280;border-color:#6b7280;color:#fff}
.st-label{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted);margin-left:4px}
.st-made .st-label{background:#eff4ff;color:#2563eb}.st-packed .st-label{background:#ecfdf3;color:var(--ok)}.st-picked .st-label{background:#f3f4f6;color:#4b5563}
.st-packed .order-info,.st-picked .order-info{opacity:.55}
.undo-fab{position:fixed;right:18px;bottom:18px;z-index:20;font:inherit;font-weight:700;font-size:1rem;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:14px 22px;box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:30;font-weight:600}
.cmds{display:flex;flex-wrap:wrap;gap:8px}
.cmds span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.92rem}
input.lim{font:inherit;width:96px;padding:10px;border:1.5px solid var(--line);border-radius:10px}
.loading{padding:60px;text-align:center;color:var(--muted)}
@media (max-width:820px){.stats,.print-row{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.label-preview{grid-template-columns:1fr 1fr}.custom{margin-left:0}.hide-sm{display:none}.how-grid{grid-template-columns:1fr}.order-btns{width:100%}.sbtn{flex:1;min-width:0}}

/* ---- print view ---- */
#print{display:none;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif}
body.printing #app{display:none}body.printing #print{display:block}body.printing{background:#fff}
.pbar{position:sticky;top:0;background:#f4f5f7;border-bottom:1px solid #ddd;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px;z-index:3}
.pbar button{font:inherit;font-weight:bold;padding:12px 20px;border-radius:10px;border:0;background:#d9481c;color:#fff;cursor:pointer}
.pbar button.back{background:#fff;color:#000;border:1px solid #ccc}
.sheet{padding:.45in .5in;max-width:8.5in;margin:0 auto}
.sheet h1{font-size:26px;margin:0}
.sheet .sub{font-size:12px;color:#444;margin:4px 0 14px}
.sheet h2{font-size:19px;margin:14px 0 4px;padding:6px 4px;border-top:3px solid #000;border-bottom:3px solid #000;display:flex;justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 .35in}
.two td{padding:5px 4px}.two .pn{font-size:19px;width:44px;padding-right:10px}.two .pm{font-size:15px}
.nw{white-space:nowrap}
.sheet table{width:100%;border-collapse:collapse}
.sheet td,.sheet th{border-bottom:1px solid #999;padding:7px 6px;text-align:left;vertical-align:top;font-size:15px}
.sheet th{font-size:11px;text-transform:uppercase;border-bottom:2px solid #000}
.box{width:16px;height:16px;border:2px solid #000;display:inline-block}
.pn{font-size:22px;font-weight:bold;width:60px;text-align:right;padding-right:14px}
.pm{font-size:17px}.sp{font-weight:bold;font-size:16px}
.pb{page-break-before:always;break-before:page}
.avoid{break-inside:avoid;page-break-inside:avoid}
.none{color:#555;font-style:italic;padding:10px 0}
.lbl{overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:.08in .15in}
.lbl .loc{font-weight:bold;letter-spacing:.04em;border:2px solid #000;padding:1px 8px;border-radius:4px}
.lbl .nm{font-weight:bold;line-height:1.05;margin-top:.06in;word-break:break-word}
.lbl .num{font-size:9px;color:#333;margin-top:2px}
.lbl.cont{align-items:flex-start;text-align:left;justify-content:center;padding:.05in .12in;line-height:1.1}
.c-row{font-size:9px;margin-top:1px}
.c-sp{font-size:9px;font-weight:bold;border:1px solid #000;padding:0 3px;margin-top:1px}
.c-who{font-size:8px;color:#333;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media print{.pbar{display:none}}

/* ---- TV ---- */
body.tv{background:#fff;color:#111}
.tvh{display:flex;justify-content:space-between;align-items:center;padding:1.4vw 2.2vw;border-bottom:.35vw solid #d9481c}
.tvh h1{margin:0;font-size:3.2vw;text-transform:uppercase;letter-spacing:.02em}
.tvh .r{text-align:right;font-size:1.5vw;color:#444}.tvh .clock{font-size:2.6vw;font-weight:800;color:#111}
#tvm{padding:1.6vw 2.2vw}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:2.2vw}
.tcol h2{margin:0 0 .8vw;font-size:2.4vw;background:#111;color:#fff;padding:.6vw 1.1vw;border-radius:.5vw;display:flex;justify-content:space-between}
.trow{display:flex;align-items:baseline;gap:1.4vw;border-bottom:.12vw solid #ddd;padding:.55vw .3vw}
.trow .n{font-size:2.8vw;font-weight:900;min-width:4.4vw;text-align:right}.trow .m{font-size:2.1vw;font-weight:600}
.tsp{display:grid;grid-template-columns:1.2fr .5fr 1.3fr .9fr;gap:1vw;font-size:1.8vw;padding:.7vw .3vw;border-bottom:.12vw solid #ddd;align-items:baseline}
.tsp.h{font-size:1.1vw;text-transform:uppercase;color:#666;font-weight:700;letter-spacing:.06em}
.tsp .x{background:#fff1ec;color:#b63a14;font-weight:800;border-radius:.4vw;padding:.1vw .6vw}
.tgyms{columns:3;column-gap:2vw}
.tgym{break-inside:avoid;margin-bottom:1.6vw;border:.15vw solid #ddd;border-radius:.8vw;overflow:hidden}
.tgym h2{margin:0;font-size:1.9vw;background:#111;color:#fff;padding:.6vw 1vw;display:flex;justify-content:space-between}
.tgym div{font-size:1.5vw;padding:.4vw 1vw;border-bottom:.1vw solid #eee}
.tempty{font-size:3vw;color:#666;text-align:center;padding:10vw 0}
.packv{display:grid;grid-template-columns:2fr 1fr;gap:2.4vw}
.pk-main{border:.4vw solid #111;border-radius:1.2vw;padding:1.8vw 2.2vw}
.pk-gym{display:inline-block;background:#111;color:#fff;font-weight:800;font-size:2vw;padding:.3vw 1vw;border-radius:.6vw}
.pk-name{font-size:5vw;font-weight:900;line-height:1.05;margin-top:1vw}
.pk-num{font-size:1.5vw;color:#555;margin-bottom:1vw}
.pk-item{font-size:2.6vw;padding:.6vw 0;border-bottom:.12vw solid #ddd}.pk-item b{display:inline-block;min-width:4vw}
.pk-sz{color:#666;font-size:2vw}.pk-sp{color:#b63a14;font-weight:800;font-size:2vw;margin-left:4vw}
.pk-next h2{font-size:2vw;margin:0 0 1vw}.pk-next div{font-size:1.8vw;padding:.8vw 0;border-bottom:.12vw solid #ddd}.pk-next span{color:#666;font-size:1.4vw}
#fs{position:fixed;right:1vw;bottom:1vw;font-size:16px;padding:12px 18px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer}

/* ---- Hands-free ---- */
.hf-top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff}
.hf{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
.cur{border:3px solid var(--ink);border-radius:18px;padding:20px;min-height:300px;background:#fff}
.cur .gym{display:inline-block;background:var(--ink);color:#fff;font-weight:800;letter-spacing:.04em;border-radius:8px;padding:4px 12px;font-size:1rem}
.cur .who{font-size:2.2rem;font-weight:800;margin:10px 0 2px;line-height:1.1}
.cur ul{list-style:none;padding:0;margin:14px 0 0;font-size:1.35rem}
.cur li{padding:8px 0;border-bottom:1px solid var(--line)}.cur li b{display:inline-block;min-width:2.2em}
.cur .sp2{display:block;color:var(--accent-d);font-weight:800;font-size:1.1rem;margin-left:2.2em}
.cur.empty{display:grid;place-items:center;text-align:center;font-size:1.6rem;color:var(--ok);font-weight:800}
.prog{margin:10px 0 0;color:var(--muted);font-weight:600}
.ctl{display:flex;flex-direction:column;gap:12px}
.talk{font:inherit;font-size:1.6rem;font-weight:800;border:0;border-radius:22px;background:var(--accent);color:#fff;min-height:190px;cursor:pointer;touch-action:manipulation}
.talk.on{background:#b42318;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.75}}
.hrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hrow button{font:inherit;font-weight:800;font-size:1.1rem;min-height:74px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer}
.hrow .done{background:var(--ok);border-color:var(--ok);color:#fff}
.heard{background:#fff;border-radius:12px;padding:12px;min-height:48px;font-size:1rem;border:1px solid var(--line)}
.heard b{display:block;font-size:.75rem;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.upnext{font-size:.95rem;color:var(--ink2)}.upnext div{padding:6px 0;border-bottom:1px dashed var(--line)}
.keep{display:flex;gap:8px;align-items:center;font-size:.95rem}.keep input{width:22px;height:22px}
.warnbox{background:#fff7e6;border:1px solid #f5d79e;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:.92rem}

.pw-row{display:block;margin:14px 0}.pw-row b{display:block}.pw-row span{display:block;font-size:13px;margin:2px 0 6px}.pw-row input{width:100%;max-width:420px;padding:10px 12px;font-size:16px;border:1px solid #cfd3da;border-radius:8px;font-family:ui-monospace,Menlo,monospace}.phelp{flex-basis:100%;font-size:14px;line-height:1.45;background:#fff8e6;border:1px solid #f0d58a;border-radius:8px;padding:10px 12px;color:#333}.phelp #pfail{margin-top:8px;color:#9b2c00}.phelp a{color:#1d67cd;font-weight:bold}@media print{.pbar{display:none!important}}.perbag{display:inline-flex;align-items:center;gap:8px;font-weight:600;margin:0 0 12px}.perbag input{width:70px;padding:8px 10px;font-size:16px;border:1px solid #cfd3da;border-radius:8px}.lbl .bag{font-size:13px;font-weight:800;letter-spacing:.04em;margin-top:3px;padding:1px 8px;background:#000;color:#fff;border-radius:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.today-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.today h2{margin:0 0 2px}.day-pick{margin:12px 0 4px;align-items:center}.day-pick .muted{font-weight:600;margin-right:4px}.today-progress{margin:14px 0 6px}.today-progress .bar{height:10px;background:#eceef2;border-radius:99px;overflow:hidden;margin-top:6px}.today-progress .bar i{display:block;height:100%;background:#1f9d55}.steps{list-style:none;margin:10px 0 0;padding:0}.step{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.step-check{flex:0 0 44px;height:44px;border-radius:50%;border:2px solid #c9ced6;background:#fff;font:inherit;font-weight:800;font-size:18px;color:#555;cursor:pointer}.step.done .step-check{background:#1f9d55;border-color:#1f9d55;color:#fff}.step-check:disabled{cursor:default}.step-body{flex:1;min-width:0}.step-body b{display:block;font-size:1.05rem}.step-body span{display:block;color:var(--muted);font-size:.92rem}.step.done .step-body b{color:#1f6b3e}.step-btn{white-space:nowrap}.btn.ghost{background:#fff <body>
<div id="app"><div class="loading">Loading…</div></div>

<script>
(function () {
var BASE = location.pathname.replace(/[^\/]*$/, '');
var API = 'https://www.advancedmealprep.com/_functions/';
var Q = new URLSearchParams(location.search);
var TVCODE = Q.get('tv') || '';
var MODE = TVCODE ? 'tv' : (Q.get('mode') === 'voice' ? 'voice' : 'app');
var CODE = TVCODE; if (!CODE) { try { CODE = localStorage.getItem('ampCode') || ''; } catch (e) {} }
var D = null, ST = { range: 'open', from: '', to: '', day: '', tab: 'today', dayPicked: false };
try { var sv = JSON.parse(sessionStorage.getItem('ampView') || 'null'); if (sv) ST = Object.assign(ST, sv); } catch (e) {}
var SIZES = { '4oz': '4 oz Meals', '6oz': '6 oz Meals' };
var STL = { '': 'To make', made: 'Made', packed: 'Packed', picked: 'Picked up' };
var VIEWS = { meals: 'Meal List', specials: 'Specials', gyms: 'Orders by Gym', pack: 'Pack Screen' };
var DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday', '_none'];
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function sz(s) { return s === '4oz' ? '4 oz' : s === '6oz' ? '6 oz' : ''; }
function sizeLabel(k) { return SIZES[k] || 'By the Pound & Other Items'; }
function toast(t) { var e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(window._tt); window._tt = setTimeout(function () { e.hidden = true; }, Math.max(2400, String(t).length * 55)); }
function saveView() { try { sessionStorage.setItem('ampView', JSON.stringify(ST)); } catch (e) {} }
function api(act, p) {
  return fetch(API + 'kitchenApi', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ code: CODE, act: act, p: p || {} }), cache: 'no-store' })
    .then(function (r) { return r.json(); }).catch(function () { return { ok: false, error: 'No connection. Check the WiFi and try again.' }; });
}
function nat(a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); }

/* ---------- data helpers (same rules as before) ---------- */
var DELIVERY_DAY = 'Wednesday';
function dayKey(o) { if (o.day) return o.day; return /deliver/i.test((o.location || '') + ' ' + (o.short || '')) ? DELIVERY_DAY : '_none'; }
var WD = { Sunday: 0, Monday: 1, Tuesday: 2, Wednesday: 3, Thursday: 4, Friday: 5, Saturday: 6 };
function nextDay(all) { var now = new Date(), t = now.getDay(), best = '', bd = 99; dayCounts(all).forEach(function (x) { var d = x[0]; if (!(d in WD)) return; var diff = (WD[d] - t + 7) % 7; if (diff === 0 && now.getHours() >= 18) diff = 7; if (diff < bd) { bd = diff; best = d; } }); return best; }
function prefs() { return Object.assign({ bagFmt: '5163', contFmt: '5160', perBag: 10 }, (D && D.prefs) || {}); }
function ckKey() { return ymd() + '|' + (ST.day || 'all'); }
function ckGet() { return ((D && D.checklist) || {})[ckKey()] || {}; }
function ckSet(step, on) { return api('check', { key: ckKey(), step: step, on: !!on }).then(function (j) { if (j.ok && D) { D.checklist = j.checklist; if (MODE === 'app' && !document.body.classList.contains('printing')) render(); } }); }
var SETTINGS_TABS = ['setup', 'limits', 'screens', 'passwords', 'voice'];
function dayLabel(d) { return d === '' ? 'All pickup days' : (d === '_none' ? 'No day / Delivery' : d + ' pickup'); }
function byDay(orders, d) { return d === '' ? orders : orders.filter(function (o) { return dayKey(o) === d; }); }
function dayCounts(orders) { var s = {}; orders.forEach(function (o) { var k = dayKey(o); s[k] = (s[k] || 0) + 1; }); return DAYS.filter(function (d) { return s[d]; }).map(function (d) { return [d, s[d]]; }); }
function leftToMake(orders) { return orders.filter(function (o) { return !o.status; }); }
function packQueue(orders) { return orders.filter(function (o) { return o.status !== 'packed' && o.status !== 'picked'; }); }
function mealCount(orders) { var n = 0; orders.forEach(function (o) { o.items.forEach(function (i) { n += i.qty; }); }); return n; }
function totals(orders) {
  var t = { '4oz': {}, '6oz': {}, other: {} };
  orders.forEach(function (o) { o.items.forEach(function (i) { var k = t[i.size] ? i.size : 'other'; t[k][i.meal] = (t[k][i.meal] || 0) + i.qty; }); });
  var out = []; ['4oz', '6oz', 'other'].forEach(function (k) { var names = Object.keys(t[k]).sort(nat); if (k === 'other' && !names.length) return; out.push([k, names.map(function (m) { return [m, t[k][m]]; })]); });
  return out;
}
function sum(list) { return list.reduce(function (a, x) { return a + x[1]; }, 0); }
function ordered(orders) { var t = {}; orders.forEach(function (o) { o.items.forEach(function (i) { t[i.meal] = (t[i.meal] || 0) + i.qty; }); }); return Object.keys(t).sort(nat).map(function (m) { return [m, t[m]]; }); }
function specials(orders) {
  var s = [];
  orders.forEach(function (o) {
    o.items.forEach(function (i) { if (i.special) s.push({ name: o.name, meal: i.meal, size: i.size, qty: i.qty, special: i.special, src: i.src || 'Comment box', location: o.location, number: o.number }); });
    if (o.note) s.push({ name: o.name, meal: 'Whole order (note at checkout)', size: '', qty: '', special: o.note, src: 'Checkout note', location: o.location, number: o.number });
  });
  return s.sort(function (a, b) { return nat(a.meal + a.size, b.meal + b.size); });
}
function byLoc(orders) { var g = [], idx = {}; orders.forEach(function (o) { if (!(o.location in idx)) { idx[o.location] = g.length; g.push([o.location, []]); } g[idx[o.location]][1].push(o); }); return g; }
function itemsHtml(o, sep) { return o.items.map(function (i) { return '<b>' + i.qty + '</b> ' + esc(i.meal) + ' <span class="muted">' + sz(i.size) + '</span>' + (i.special ? ' <span class="special">' + esc(i.special) + '</span>' : ''); }).join(sep); }
function clock() { var d = new Date(), h = d.getHours(), m = d.getMinutes(); return ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? ' AM' : ' PM'); }
function today() { return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }); }
function ymd() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

/* ---------- login ---------- */
function showLogin(bad) {
  document.body.className = 'login';
  $('app').innerHTML = '<main class="login-box"><div class="logo">AMP <span>Kitchen</span></div><form id="lf"><label for="pw">Password</label>' +
    '<input id="pw" type="password" autocomplete="current-password" autofocus>' + (bad ? '<p class="err">Wrong password. Try again.</p>' : '') +
    '<button class="btn big">Open</button><p class="muted" style="font-size:.85rem;margin-top:12px">Owner and cooks each have their own password. You\'ll stay signed in on this device.</p></form></main>';
  $('lf').onsubmit = function (e) {
    e.preventDefault(); CODE = $('pw').value.trim();
    api('who').then(function (j) { if (j.ok && j.role !== 'tv') { try { localStorage.setItem('ampCode', CODE); } catch (x) {} start(); } else { CODE = ''; showLogin(true); } });
  };
}
function logout() { try { localStorage.removeItem('ampCode'); } catch (e) {} CODE = ''; showLogin(false); }

/* ---------- main app ---------- */
function load() {
  return api('data', { range: ST.range, from: ST.from, to: ST.to, useScreen: MODE !== 'app' }).then(function (j) {
    if (!j.ok && /wrong code|not allowed/i.test(j.error || '')) { if (MODE === 'tv') { $('app').innerHTML = '<p style="font:24px sans-serif;padding:40px">Kitchen screen link is missing its code.</p>'; return null; } logout(); return null; }
    D = j; return j;
  });
}
function render() {
  if (!D) return;
  document.body.className = '';
  var owner = D.role === 'owner';
  var all = D.orders || [];

  var mealsLeft = mealCount(toMake), mealsAll = mealCount(orders);
  var packed = orders.filter(function (o) { return o.status === 'packed' || o.status === 'picked'; }).length;
  var limits = D.limits || {}, ord = ordered(orders), ordMap = {}; ord.forEach(function (x) { ordMap[x[0]] = x[1]; });
  var soldOut = ord.filter(function (x) { return limits[x[0]] && x[1] >= limits[x[0]]; }).map(function (x) { return x[0]; });
  var tab = ST.tab || 'today'; if (!owner && (tab === 'limits' || tab === 'screens' || tab === 'passwords')) tab = 'setup';
  var inSettings = SETTINGS_TABS.indexOf(tab) >= 0;
  var tabs = [['today', 'Today'], ['meals', 'Meal List'], ['specials', 'Specials (' + sp.length + ')'], ['pack', 'Pack Orders'], ['gyms', 'Orders by Gym'], ['labels', 'Labels'], ['settings', '⚙ Settings' + (soldOut.length && owner ? ' (' + soldOut.length + ')' : '')]];
  var subTabs = [['setup', 'Labels & Bags']];
  if (owner) { subTabs.push(['limits', 'Sold-Out Limits' + (soldOut.length ? ' (' + soldOut.length + ')' : '')]); subTabs.push(['screens', 'Kitchen Screens']); subTabs.push(['passwords', 'Passwords']); }
  subTabs.push(['voice', 'Voice & Pedal']);
  var h = [];
  h.push('<div class="install-tip" id="installTip" hidden><span id="installText">Add AMP Kitchen to your home screen: tap <b>Share</b> then <b>Add to Home Screen</b>.</span><button class="x" data-a="hideTip" aria-label="Close">✕</button></div>');
  h.push('<header class="top"><div class="logo">AMP <span>Kitchen</span>' + (owner ? '' : ' <span class="role-tag">Cook</span>') + '</div><div class="top-right"><span class="muted hide-sm">' + today() + '</span>' +
    '<button class="btn ghost sm" data-a="refresh">↻ Refresh</button><button class="btn ghost sm" data-a="logout">Log out</button></div></header><main class="wrap">');
  // range
  if (tab !== 'today' && !inSettings) {
  h.push('<section class="range card"><div class="range-head"><h2>Which orders?</h2><span class="muted">' + esc(D.label) + (ST.day ? ' · ' + esc(dayLabel(ST.day)) : '') + '</span></div><div class="chips">');
  [['open', 'All open orders'], ['today', 'Today'], ['week', 'This week'], ['7days', 'Last 7 days']].forEach(function (r) { h.push('<button class="chip' + (ST.range === r[0] ? ' on' : '') + '" data-a="range" data-v="' + r[0] + '">' + r[1] + '</button>'); });
  h.push('<span class="custom"><span class="muted" style="font-size:13px">Orders placed</span> <input type="date" id="dFrom" max="' + ymd() + '" value="' + esc(ST.from || ymd()) + '" aria-label="Orders placed from"> to <input type="date" id="dTo" max="' + ymd() + '" value="' + esc(ST.to || ymd()) + '" aria-label="Orders placed to"><button class="chip' + (ST.range === 'custom' ? ' on' : '') + '" data-a="custom">Show</button></span></div>');
  var dc = dayCounts(all);
  if (dc.length > 1 || ST.day) {
    h.push('<div class="chips" style="margin-top:12px"><span class="muted" style="font-weight:600;margin-right:4px">Pickup day:</span><button class="chip' + (ST.day === '' ? ' on' : '') + '" data-a="day" data-v="">All days (' + all.length + ')</button>');
    dc.forEach(function (d) { h.push('<button class="chip' + (ST.day === d[0] ? ' on' : '') + '" data-a="day" data-v="' + d[0] + '">' + esc(d[0] === '_none' ? 'No day / Delivery' : d[0]) + ' (' + d[1] + ')</button>'); });
    h.push('</div>');
  }
  h.push('</section>');
  }
  if (D.error) h.push('<div class="alert err"><b>Couldn\'t load orders from Wix.</b> ' + esc(D.error) + '</div>');
  if (soldOut.length && owner) h.push('<div class="alert warn"><b>Sold out:</b> ' + esc(soldOut.join(', ')) + ' hit your limit. Pause ' + (soldOut.length > 1 ? 'them' : 'it') + ' in Wix so no more orders come in. <a href="#" data-a="tab" data-v="limits">See limits</a></div>');
  if (tab !== 'today' && !inSettings) h.push('<section class="stats"><div class="stat"><b>' + orders.length + '</b><span>Orders</span></div><div class="stat"><b>' + mealsLeft + '</b><span>Meals left to make' + (mealsLeft < mealsAll ? ' (of ' + mealsAll + ')' : '') + '</span></div>' +
    '<div class="stat"><b>' + packed + '/' + orders.length + '</b><span>Orders packed</span><div class="bar"><i style="width:' + (orders.length ? Math.round(packed / orders.length * 100) : 0) + '%"></i></div></div><div class="stat"><b>' + sp.length + '</b><span>Specials left</span></div></section>');
  if (tab !== 'today' && !inSettings) h.push('<section class="print-row"><button class="print-btn primary" data-a="print" data-v="all"><b>🖨 Print Morning Packet</b><span>Meal list, specials &amp; packing list for each gym</span></button>' +
    '<button class="print-btn" data-a="print" data-v="meals"><b>Meal List</b><span>Totals, 4 oz &amp; 6 oz</span></button>' +
    '<button class="print-btn" data-a="print" data-v="labels"><b>Bag Labels</b><span>' + bagLabelCount(orders) + ' labels, by gym</span></button>' +
    '<button class="print-btn" data-a="print" data-v="containers"><b>Container Labels</b><span>' + mealsAll + ' labels, one per meal</span></button></section>');
  h.push('<nav class="tabs">' + tabs.map(function (t) { var on = t[0] === 'settings' ? inSettings : tab === t[0]; return '<button class="tab' + (on ? ' on' : '') + '" data-a="tab" data-v="' + t[0] + '">' + esc(t[1]) + '</button>'; }).join('') + '</nav>');
  if (inSettings) h.push('<div class="chips subnav">' + subTabs.map(function (t) { return '<button class="chip' + (tab === t[0] ? ' on' : '') + '" data-a="tab" data-v="' + t[0] + '">' + esc(t[1]) + '</button>'; }).join('') + '</div>');
  if (tab === 'today') todayView(h, all, orders, toMake, sp, packed, mealsAll, owner);
  if (tab === 'setup') setupView(h, owner);
  if (!orders.length && !D.error && tab !== 'today' && !inSettings) h.push('<div class="card empty">No orders for ' + esc(String(D.label).toLowerCase()) + '.</div>');

  if (tab === 'meals' && orders.length) {
    if (mealsLeft < mealsAll) h.push('<p class="muted" style="margin-top:-4px">Showing meals <b>still to make</b>. Orders marked Made come off this list.</p>');
    h.push('<div class="cols">');
    allTot.forEach(function (g) {
      var left = {}; (tot.filter(function (x) { return x[0] === g[0]; })[0] || [0, []])[1].forEach(function (x) { left[x[0]] = x[1]; });
      var nLeft = 0; Object.keys(left).forEach(function (k) { nLeft += left[k]; });
      h.push('<div class="card"><div class="card-head"><h2>' + esc(sizeLabel(g[0])) + '</h2><span class="pill">' + nLeft + ' left' + (nLeft < sum(g[1]) ? ' of ' + sum(g[1]) : '') + '</span></div><table class="list">');
      g[1].forEach(function (x) {
        var l = left[x[0]] || 0, lim = limits[x[0]] || 0;
        h.push('<tr class="' + (l ? '' : 'done-row') + '"><td class="n">' + (l || '✓') + '</td><td>' + esc(x[0]) + (l < x[1] ? ' <span class="muted">(' + (x[1] - l) + ' made)</span>' : '') +
          (lim && (ordMap[x[0]] || 0) >= lim ? ' <span class="tag red">SOLD OUT</span>' : '') + '</td></tr>');
      });
      h.push('</table></div>');
    });
    h.push('</div>');
  }
  if (tab === 'specials' && orders.length) {
    h.push('<div class="card"><h2>How specials are found</h2><p class="muted" style="margin:6px 0 12px">Customers ask for changes 3 ways on the Wix site. The app catches all 3 and lists them here. Specials drop off once the order is marked Made.</p><div class="how-grid">' +
      '<div><span class="src s1">Comment box</span><p>The customer typed a request in the comment box when ordering the meal.</p></div><div><span class="src s2">Dropdown</span><p>The customer picked a choice like "No cheese" or a swap from the dropdown.</p></div><div><span class="src s3">Checkout note</span><p>The customer left a note for the whole order at checkout.</p></div></div></div><div class="card">');
    if (!sp.length) h.push('<p class="muted">No special requests left. Every remaining meal is made the normal way.</p>');
    else {
      h.push('<table class="list wide"><tr><th>Meal</th><th>Size</th><th>Special</th><th>How it came in</th><th>Customer</th><th>Pickup</th></tr>');
      sp.forEach(function (s) { var c = { 'Comment box': 's1', 'Dropdown': 's2', 'Checkout note': 's3' }[s.src] || 's1'; h.push('<tr><td><b>' + esc(s.meal) + '</b>' + (s.qty > 1 ? ' ×' + s.qty : '') + '</td><td style="white-space:nowrap">' + sz(s.size) + '</td><td class="special">' + esc(s.special) + '</td><td><span class="src ' + c + '">' + esc(s.src) + '</span></td><td>' + esc(s.name) + '</td><td>' + esc(s.location) + '</td></tr>'); });
      h.push('</table>');
    }
    h.push('</div>');
  }
  if (tab === 'pack' && orders.length) {
    h.push('<div class="card"><b>Tap as you go:</b> <span class="st-dot made"></span> Made → <span class="st-dot packed"></span> Packed → <span class="st-dot picked"></span> Picked up. Made orders come off the Meal List and TVs. Tapped the wrong one? Hit <b>Undo</b>.</div>');

      g[1].forEach(function (o) {
